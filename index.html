<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eff0eb" />
    <meta name="description" content="RwandAir seat preview concept: see the view from your window seat before you pay for it. Demonstration data only." />
    <title>RwandAir · Seat preview (demo)</title>
    <link rel="icon" type="image/png" href="brand/rwandair-icon.png" />
  </head>
  <body>
    <div id="app" class="app" data-view="map" data-ink="dark">
      <canvas id="stage" class="stage" aria-hidden="true"></canvas>
      <div id="fallback" class="fallback" hidden></div>

      <header class="topbar">
        <button class="back" id="back" type="button" aria-label="Reset seat map view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.2 6.2 8.4 12l5.8 5.8" /></svg>
        </button>
        <div class="titles">
          <h1 class="title" id="title">
            <span class="title-a">Choose your seat</span>
            <span class="title-b" aria-hidden="true"></span>
          </h1>
          <p class="itinerary" id="itinerary"></p>
        </div>
        <div class="brand" title="RwandAir — demonstration only">
          <img class="brand-logo" src="brand/rwandair-logo.png" alt="RwandAir — Fly the dream of Africa" width="252" height="55" />
          <img class="brand-icon" src="brand/rwandair-icon.png" alt="RwandAir" width="400" height="301" />
        </div>
      </header>

      <section class="sheet" id="sheet" aria-label="Seat details">
        <div class="pane pane-map" id="pane-map">
          <h2 class="map-title"><svg class="ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7.5" /></svg><span id="map-title">Tap a window seat</span></h2>
          <p class="map-detail" id="map-detail">See the view before you pay for it</p>
        </div>

        <div class="pane pane-wall" id="pane-wall" hidden>
          <div class="idline"><span class="big" id="wall-seat">11A</span><span class="aside" id="wall-soldas">Sold as a window seat</span></div>
          <h2 class="headline wall-headline" id="wall-title">No window in this row</h2>
          <p class="detail"><span class="dot" style="background: #adadad"></span><span id="wall-detail">Just the wall panel between two windows</span></p>
          <div class="actions">
            <button class="btn btn-dark" id="change-seat" type="button">Change seat</button>
            <button class="btn btn-light btn-keep" id="keep-wall" type="button">
              <span class="label label-default" id="keep-wall-label">Keep 11A · €9</span>
              <span class="label label-done" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7.5" /></svg><span class="done-text"></span></span>
            </button>
          </div>
        </div>

        <div class="pane pane-window" id="pane-window" hidden>
          <div class="idline"><span class="big clock" id="clock">16:05</span><span class="aside" id="phase">Takeoff</span></div>
          <div class="feedback" id="feedback">
            <div class="fb is-on"><h2 class="headline"></h2><p class="detail"><span class="dot"></span><span class="txt"></span></p></div>
            <div class="fb"><h2 class="headline"></h2><p class="detail"><span class="dot"></span><span class="txt"></span></p></div>
          </div>
          <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="Flight time" aria-valuemin="0" aria-valuemax="110" aria-valuenow="0" aria-valuetext="">
            <div class="track"></div>
            <div class="thumb"></div>
          </div>
          <div class="labels" id="timeline-labels" aria-hidden="true"></div>
          <button class="btn btn-dark btn-wide btn-keep" id="keep-window" type="button">
            <span class="label label-default"><span id="keep-window-label">Keep seat 23A</span> <span class="price" id="keep-window-price">€14</span></span>
            <span class="label label-done" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7.5" /></svg><span class="done-text"></span></span>
          </button>
        </div>
      </section>

      <div class="shade-handle" id="shade-handle" role="slider" tabindex="-1" aria-label="Window shade" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Shade open" hidden></div>
      <div class="hint" id="hint" aria-hidden="true">Pull the shade down</div>

      <div class="seat-grid" id="seat-grid" role="grid" aria-label="Seat map: arrow keys move between seats, Enter chooses"></div>
      <div class="focus-label" id="focus-label" aria-hidden="true"></div>
      <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

      <div class="loader" id="loader" aria-hidden="true">
        <img src="brand/rwandair-icon.png" alt="" width="400" height="301" />
        <span class="bar"><span></span></span>
      </div>
    </div>
    <noscript><p style="padding: 24px; font-family: system-ui">This seat preview demo needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
